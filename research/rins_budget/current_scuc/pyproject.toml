[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "current-scuc"
version = "0.1.0"
description = "Current projected SCUC candidate with local source and runtime receipts"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE.txt"}
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "threadpoolctl==3.6.0"]

[tool.setuptools.packages.find]
include = ["current_scuc*"]

[tool.setuptools.package-data]
current_scuc = ["*.json"]
